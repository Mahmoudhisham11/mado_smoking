<!-- @dsCard height=300 -->
<style>html,body{margin:0;background:var(--bg)}svg{display:block;width:960px;height:300px;font-family:var(--font-sans);direction:ltr}
.g{fill:var(--gold)}.gs{fill:var(--gold-soft)}.ok{fill:var(--success)}.no{fill:var(--danger)}.sr{fill:var(--surface-raised)}
.hl{stroke:var(--gold-text);stroke-width:1;fill:none;opacity:.6}.t1{fill:var(--ink);font-weight:800}.t2{fill:var(--ink-muted);font-weight:400}.r-lg{rx:14px}.r-md{rx:10px}.r-xl{rx:22px}</style>
<svg viewBox="0 0 960 300" role="img" aria-label="Mado Smoking">
<!-- blocks: gold 168x220 bleeding off the top (space-multiples), gold-soft 136x156, surface-raised 128x180 bleeding off the bottom, success 72x72, danger 40x40 (radius-lg/md).
 arrangement: staggered stack of unequal slabs in the left box (x<=480), mirrored for RTL so the name sits on the right.
 pattern: three hairline rules in gold-text — a luxury ledger feel, restrained, crossing only the blocks — chosen because the system is sober, editorial, gold used sparingly.
 steps: space-4/6/8 multiples; radii radius-md/lg/xl. -->
<rect class="g r-lg" x="40" y="-14" width="168" height="234"/>
<rect class="gs r-lg" x="224" y="40" width="136" height="156"/>
<rect class="sr r-lg" x="224" y="212" width="128" height="104"/>
<rect class="sr r-lg" x="40" y="236" width="168" height="80"/>
<rect class="ok r-md" x="376" y="112" width="72" height="72"/>
<rect class="no r-md" x="376" y="200" width="40" height="40"/>
<line class="hl" x1="40" y1="96" x2="448" y2="96"/><line class="hl" x1="40" y1="148" x2="448" y2="148"/><line class="hl" x1="40" y1="200" x2="448" y2="200"/>
<text class="t1" x="920" y="196" text-anchor="end" font-size="72">Mado</text>
<text class="t1" x="920" y="262" text-anchor="end" font-size="72">Smoking</text>
<text class="t2" x="920" y="286" text-anchor="end" font-size="13">مادو للتدخين · تجارة الجملة</text>
</svg>
