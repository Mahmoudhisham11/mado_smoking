function render(){var t=document.querySelector('template[data-v="'+st.v+'"]');ab.innerHTML=t.innerHTML;ab.setAttribute('data-theme',st.th);
var d=st.vp==='d',w=d?1440:390,h=d?900:844;ab.style.width=w+'px';ab.style.height=h+'px';
var av=document.documentElement.clientWidth-24,s=Math.min(1,av/w);sc.style.transform='scale('+s+')';sc.style.width=w+'px';sc.style.height=h+'px';
stg.style.height=(h*s+32)+'px';sc.style.marginBottom=(-h*(1-s))+'px';
['gv','gp','gt'].forEach(function(g){[].forEach.call(document.getElementById(g).children,function(b){var k=b.dataset.view||b.dataset.vp||b.dataset.th;b.classList.toggle('on',k===st.v||k===st.vp||k===st.th)})})}
document.querySelector('.bar').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.view)st.v=b.dataset.view;if(b.dataset.vp)st.vp=b.dataset.vp;if(b.dataset.th)st.th=b.dataset.th;render()});
window.addEventListener('resize',render);render()})();
</script>
